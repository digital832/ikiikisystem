<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>利用者の新規登録</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">

  <div class="topbar">
    <a href="index.html" class="app-title">🌿 いきいき治療院<span class="app-title-sub">利用者の新規登録</span></a>
  </div>

  <div class="wizard-grid">
    <div class="card">
      <p class="card-heading"><span class="badge">👤</span>基本情報</p>

      <div class="field">
        <label class="field-label" for="name">名前<span class="required">必須</span></label>
        <input class="text-input" type="text" id="name" placeholder="例：山田 花子" />
      </div>

      <div class="field">
        <label class="field-label" for="kana">フリガナ</label>
        <input class="text-input" type="text" id="kana" placeholder="例：ヤマダ ハナコ" />
      </div>

      <div class="field">
        <label class="field-label" for="gender">性別</label>
        <select class="select-input" id="gender">
          <option value="">選択してください</option>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="birthDate">生年月日</label>
        <input class="date-input" type="date" id="birthDate" />
      </div>

      <div class="field">
        <label class="field-label" for="address">住所</label>
        <input class="text-input" type="text" id="address" placeholder="例：下関市一の宮住吉3丁目1-9-401号" />
      </div>

      <div class="field">
        <label class="field-label" for="phone">電話番号</label>
        <input class="text-input" type="text" id="phone" inputmode="tel" placeholder="例：083-237-9115" />
      </div>

      <div class="field">
        <label class="field-label" for="relationship">被保険者との続柄</label>
        <select class="select-input" id="relationship">
          <option value="">選択してください</option>
          <option value="本人">本人</option>
          <option value="家族">家族</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="clinic">所属治療院</label>
        <select class="select-input" id="clinic">
          <option value="">選択してください</option>
        </select>
      </div>
    </div>

    <div class="card">
      <p class="card-heading"><span class="badge">🩺</span>保険情報</p>

      <div class="field">
        <label class="field-label" for="insurerNumber">保険者番号</label>
        <input class="text-input" type="text" id="insurerNumber" inputmode="numeric" placeholder="例：39352018" />
      </div>

      <div class="field">
        <label class="field-label" for="insuredSymbolNumber">被保険者証の記号番号</label>
        <input class="text-input" type="text" id="insuredSymbolNumber" placeholder="例：04569059" />
      </div>

      <div class="field">
        <label class="field-label" for="recipientNumber">受給者番号</label>
        <input class="text-input" type="text" id="recipientNumber" placeholder="後期高齢者などの場合" />
      </div>

      <div class="field">
        <label class="field-label" for="publicExpensePayerNumber">公費負担者番号</label>
        <input class="text-input" type="text" id="publicExpensePayerNumber" placeholder="該当者のみ" />
      </div>

      <div class="field">
        <label class="field-label" for="publicExpenseRecipientNumber">公費受給者番号</label>
        <input class="text-input" type="text" id="publicExpenseRecipientNumber" placeholder="該当者のみ" />
      </div>

      <div class="field">
        <label class="field-label" for="copayRatio">一部負担金の割合</label>
        <select class="select-input" id="copayRatio">
          <option value="">選択してください</option>
          <option value="1割">1割</option>
          <option value="2割">2割</option>
          <option value="3割">3割</option>
        </select>
      </div>
    </div>

    <div class="card" id="userListCard">
      <p class="card-heading"><span class="badge">📋</span>登録済みの利用者</p>
      <div id="userList" class="user-list"></div>
      <p class="field-hint" id="userListEmptyHint" hidden>まだ登録されている利用者はいません。</p>
    </div>
  </div>

  <div class="footer-card">
    <button class="word-button" type="button" id="backButton">← 戻る</button>
    <button class="send-button" type="button" id="saveUserButton">✅ この内容で登録する</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  async function apiGet(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "通信に失敗しました");
    return res.json();
  }

  async function apiPost(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "通信に失敗しました");
    return res.json();
  }

  const fields = {
    name: document.getElementById("name"),
    kana: document.getElementById("kana"),
    gender: document.getElementById("gender"),
    birthDate: document.getElementById("birthDate"),
    address: document.getElementById("address"),
    phone: document.getElementById("phone"),
    relationship: document.getElementById("relationship"),
    clinic: document.getElementById("clinic"),
    insurerNumber: document.getElementById("insurerNumber"),
    insuredSymbolNumber: document.getElementById("insuredSymbolNumber"),
    recipientNumber: document.getElementById("recipientNumber"),
    publicExpensePayerNumber: document.getElementById("publicExpensePayerNumber"),
    publicExpenseRecipientNumber: document.getElementById("publicExpenseRecipientNumber"),
    copayRatio: document.getElementById("copayRatio"),
  };
  const backButton = document.getElementById("backButton");
  const saveUserButton = document.getElementById("saveUserButton");
  const userList = document.getElementById("userList");
  const userListEmptyHint = document.getElementById("userListEmptyHint");
  const toast = document.getElementById("toast");

  const prefillName = new URLSearchParams(location.search).get("name");
  if (prefillName) fields.name.value = prefillName;

  let toastTimer = null;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
  }

  async function loadClinics() {
    let clinics = [];
    try {
      clinics = await apiGet("/api/clinics");
    } catch (err) {
      showToast(err.message);
    }
    clinics.forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c.name;
      opt.textContent = c.name;
      fields.clinic.appendChild(opt);
    });
  }

  async function renderUserList() {
    userList.innerHTML = '<p class="field-hint">読み込み中...</p>';
    let users;
    try {
      users = await apiGet("/api/users");
    } catch (err) {
      userList.innerHTML = "";
      showToast(err.message);
      return;
    }
    userList.innerHTML = "";
    userListEmptyHint.hidden = users.length > 0;
    users
      .slice()
      .reverse()
      .forEach((u) => {
        const row = document.createElement("div");
        row.className = "user-list-row";
        const meta = [u.kana, u.gender, u.birthDate, u.phone, u.clinic].filter(Boolean).join(" / ");
        row.innerHTML = `
          <div>
            <div class="user-list-row-name">${u.name}</div>
            ${meta ? `<div class="user-list-row-meta">${meta}</div>` : ""}
          </div>
        `;
        userList.appendChild(row);
      });
  }

  function goBack() {
    if (history.length > 1) {
      history.back();
    } else {
      window.close();
      setTimeout(() => { location.href = "index.html"; }, 300);
    }
  }

  backButton.addEventListener("click", goBack);

  saveUserButton.addEventListener("click", async () => {
    const name = fields.name.value.trim();
    if (!name) {
      showToast("名前を入力してください");
      fields.name.focus();
      return;
    }
    saveUserButton.disabled = true;
    try {
      await apiPost("/api/users", {
        name,
        kana: fields.kana.value.trim(),
        gender: fields.gender.value,
        birthDate: fields.birthDate.value,
        address: fields.address.value.trim(),
        phone: fields.phone.value.trim(),
        relationship: fields.relationship.value,
        clinic: fields.clinic.value,
        insurerNumber: fields.insurerNumber.value.trim(),
        insuredSymbolNumber: fields.insuredSymbolNumber.value.trim(),
        recipientNumber: fields.recipientNumber.value.trim(),
        publicExpensePayerNumber: fields.publicExpensePayerNumber.value.trim(),
        publicExpenseRecipientNumber: fields.publicExpenseRecipientNumber.value.trim(),
        copayRatio: fields.copayRatio.value,
      });
      showToast("登録しました");
      Object.values(fields).forEach((el) => (el.value = ""));
      renderUserList();
    } catch (err) {
      showToast(err.message);
    } finally {
      saveUserButton.disabled = false;
    }
  });

  loadClinics();
  renderUserList();
</script>
</body>
</html>
